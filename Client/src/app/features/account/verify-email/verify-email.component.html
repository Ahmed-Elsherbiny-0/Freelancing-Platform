<section>
  <div class="container flex mx-auto">
    <!-- Loading -->
    @if (status() == 'loading') {
      <div class="box">
        <div class="spinner"></div>
        <p>Verifying your account...</p>
      </div>
    }
    <!-- Success -->
    @if (status() == 'success') {
      <div class="box">
        <div class="icon success-icon">&#10003;</div>
        <h2>Account Confirmed!</h2>
        <p>Your account has been verified successfully.</p>
        <a routerLink="/login" class="btn cursor-pointer">Go to Login</a>
      </div>
    }

    <!-- Error -->
    @if (status() == 'error') {
      <div class="box">
        <div class="icon error-icon">&#10007;</div>
        <h2>Verification Failed</h2>
        <p>The link is invalid or has expired.</p>
        <a routerLink="/signup" class="btn">Back to Register</a>
      </div>
    }
  </div>
</section>
