<section
  class="transition-transform hover:-translate-y-2"
  [routerLink]="['/workers', worker.email]"
>
  <div
    class="p-5 bg-[var(--secondary-color)] rounded-3xl border-[var(--border-components)] border cursor-pointer"
  >
    <div class="flex justify-between">
      <div class="flex flex-col gap-1.5">
        <h2
          class="text-[var(--text-primary)] font-semibold text-lg transition-all duration-300 card-header"
        >
          {{ displayName }}
        </h2>
        <div class="flex gap-1 items-center">
          <span>
            <svg
              class="w-3 h-3 sm:w-3.5 sm:h-3.5 opacity-60 shrink-0"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </span>
          <p class="text-[12px] text-[var(--paragraph-secondary)]">{{ worker.country }}</p>
        </div>
        <div class="flex gap-2 p-2 bg-[var(--stars-background)] rounded-2xl w-fit items-center">
          <div class="flex gap-1">
            <svg
              #star
              class="w-2.5 h-2.5 sm:w-3 sm:h-3 text-accent"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="#fbbf24"
              stroke="#fbbf24"
              stroke-width="2.5"
            >
              <path
                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
              ></path>
            </svg>
            <svg
              #star
              class="w-2.5 h-2.5 sm:w-3 sm:h-3 text-accent"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="#fbbf24"
              stroke="#fbbf24"
              stroke-width="2.5"
            >
              <path
                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
              ></path>
            </svg>
            <svg
              #star
              class="w-2.5 h-2.5 sm:w-3 sm:h-3 text-accent"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="#fbbf24"
              stroke="#fbbf24"
              stroke-width="2.5"
            >
              <path
                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
              ></path>
            </svg>
            <svg
              #star
              class="w-2.5 h-2.5 sm:w-3 sm:h-3 text-accent"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="#fbbf24"
              stroke="#fbbf24"
              stroke-width="2.5"
            >
              <path
                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
              ></path>
            </svg>
            <svg
              #star
              class="w-2.5 h-2.5 sm:w-3 sm:h-3 text-accent"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="#fbbf24"
              stroke="#fbbf24"
              stroke-width="2.5"
            >
              <path
                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
              ></path>
            </svg>
          </div>
          <p class="text-[#fbbf24] font-bold text-[12px]">{{ worker.rating?.toFixed(1) }}</p>
        </div>
      </div>
      <div class="rounded-[50%] shadow-lg w-[70px] h-[70px] overflow-hidden">
        <img [src]="worker.photoUrl" class="w-full" />
      </div>
    </div>
    <div class="border border-[var(--border-components)] opacity-60 mt-5"></div>
    <div class="flex flex-col gap-2 mt-2 min-h-[68px] overflow-hidden">
      <p
        class="text-[var(--paragraph-secondary)] text-[12px] font-medium opacity-70 ml-1 description"
      >
        {{ worker.description }}
      </p>
      <div class="flex w-[70%] justify-between mx-auto">
        @for (skill of worker.skills; track $index) {
          @if ($index < 3) {
            <p
              class="text-[var(--color-primary)] hover:text-[var(--text-primary)] transition-all duration-300 text-[12px]"
            >
              {{ skill.toUpperCase() }}
            </p>
          }
        }
      </div>
    </div>
    <div class="border border-[var(--border-components)] opacity-60 my-2"></div>

    <div class="flex justify-between">
      <div class="flex gap-2 items-center opacity-30 tasks">
        <p class="font-medium text-[12px] transition-all duration-300">
          {{ worker.completedTasks }} Completed
        </p>
        <span
          class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-light-white flex items-center justify-center transition-all duration-300 shadow-sm"
        >
          <svg
            class="w-4 h-4 sm:w-4.5 sm:h-4.5 opacity-70"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
        </span>
      </div>
      <div
        class="flex items-center text-[var(--color-primary)] text-sm show-icon transition-all duration-300 opacity-0"
      >
        <span>
          <svg
            class="w-4 h-4 sm:w-4.5 sm:h-4.5 rotate-180"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </span>
        <p>Profile</p>
      </div>
    </div>
  </div>
</section>
