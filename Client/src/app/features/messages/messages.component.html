<app-header />
<section
  class="text-[var(--text-primary)] h-[calc(100vh-64px)] border border-solid border-[var(--border-components)]"
>
  <div class="flex flex-wrap w-full h-full">
    <div class="basis-[300px] order-3 bg-[var(--secondary-color)] messages-container h-full">
      <div class="text-top py-2 pb-4 px-4 flex flex-col gap-2">
        <div class="flex justify-between">
          <h2 class="text-lg">Chats</h2>
          <button>
            <span class="w-[24px] h-[24px]">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-rotate-ccw"
                aria-hidden="true"
              >
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
              </svg>
            </span>
          </button>
        </div>
        <form class="relative">
          <input
            type="text"
            placeholder="Search"
            class="border-[2px] p-2 border-solid border-[var(--border-components)] w-full rounded-2xl outline-0 focus:border-[var(--color-primary)]"
          />
          <button class="search-icon w-[24px] h-[24px] absolute">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-search"
              aria-hidden="true"
            >
              <path d="m21 21-4.34-4.34"></path>
              <circle cx="11" cy="11" r="8"></circle>
            </svg>
          </button>
        </form>
      </div>
      <div class="border-[1px] border-solid border-[var(--border-components)] w-full"></div>
      <div class="flex gap-2 flex-col p-2 overflow-y-auto scrolled max-h-screen">
        @for (item of arr(); track item.username) {
          <button
            class="flex justify-between p-3 border-[1px] border-solid border-[var(--border-components)] rounded-xl cursor-pointer transition-[.3s] hover:bg-[var(--theme-bg)]"
            (click)="onOpenChat(item.username)"
          >
            <div class="flex gap-2 justify-end order-1">
              <img [src]="item.img" class="w-[40px] h-[40px] rounded-[50%] order-1" />
              <div class="flex flex-col gap-1 justify-center text-end">
                <h4 class="text-xs font-semibold tracking-wide">{{ item.name }}</h4>
                <p class="text-xs text-[var(--paragraph-secondary)]">{{ item.lastMessage() }}</p>
              </div>
            </div>
            <div class="flex flex-col gap-1 items-center">
              <p class="text-[var(--paragraph-secondary)] text-[10px]">
                {{ item.lastvisit() | date }}
              </p>
              @if (item.unreaded() != 0) {
                <p
                  class="w-[24px] h-[24px] rounded-[50%] bg-[#05ae5467] flex justify-center items-center text-sm!"
                >
                  <span class="font-bold text-[10px]">{{ item.unreaded() }}</span>
                </p>
              }
            </div>
          </button>
        }
      </div>
    </div>
    <div
      class="basis-[calc(100%-300px)] w-full messages-chat relative h-full overflow-y-auto"
      #messagesContainer
    >
      @if (!openChat()) {
        <div class="flex justify-center items-center h-full">
          <div class="flex flex-col gap-3 items-center max-w-[350px] w-full">
            <span
              class="block w-[80px] h-[80px] bg-[var(--secondary-color)] rounded-[50%] flex justify-center items-center"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="48"
                height="48"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-send -rotate-12 opacity-60"
                aria-hidden="true"
                stroke="var(--color-primary)"
              >
                <path
                  d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"
                ></path>
                <path d="m21.854 2.147-10.94 10.939"></path>
              </svg>
            </span>
            <h2 class="font-semibold text-xl tracking-wide">Private Messages</h2>
            <p class="text-[var(--paragraph-secondary)] text-base text-center text-sm">
              Start contact with Freelancers or Clients to disicuss details and start working
            </p>
          </div>
        </div>
      }

      @if (openChat()) {
        <router-outlet></router-outlet>
      }
    </div>
  </div>
</section>
