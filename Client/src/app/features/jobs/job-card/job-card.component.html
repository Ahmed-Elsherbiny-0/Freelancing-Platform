<section
  class="transition-transform hover:-translate-y-2 h-[250px]"
  [routerLink]="['/announcements', job.id]"
>
  <div
    class="p-5 bg-[var(--secondary-color)] rounded-3xl border-[var(--border-components)] border cursor-pointer h-full"
  >
    <div class="flex justify-between items-center">
      <div class="flex flex-col gap-0">
        <h2 class="text-[var(--text-primary)] font-semibold tracking-wide text-sm p-0">
          {{ job.title }}
        </h2>
        <div class="text-[10px] text-[var(--paragraph-secondary)] flex gap-1 items-center">
          <span
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-calendar-days opacity-60"
              aria-hidden="true"
            >
              <path d="M8 2v4"></path>
              <path d="M16 2v4"></path>
              <rect width="18" height="18" x="3" y="4" rx="2"></rect>
              <path d="M3 10h18"></path>
              <path d="M8 14h.01"></path>
              <path d="M12 14h.01"></path>
              <path d="M16 14h.01"></path>
              <path d="M8 18h.01"></path>
              <path d="M12 18h.01"></path>
              <path d="M16 18h.01"></path>
            </svg>
          </span>
          <p>{{ job.createdDate | date }}</p>
        </div>
      </div>
      <p
        class="text-[#fbbf24] px-3 py-2 bg-[var(--stars-background)] rounded-2xl text-[12px] font-semibold"
      >
        {{ job.status }}
      </p>
    </div>
    <div class="flex gap-5 text-[var(--paragraph-secondary)] mt-5 flex-col">
      <p class="font-medium description">
        {{ job.description }}
      </p>
      <div class="flex justify-between">
        @for (item of job.reqiuiredSkills; track $index) {
          @if ($index < 3) {
            <p
              class="text-[var(--paragraph-secondary)] hover:text-[var(--text-primary)] transition-all duration-300 text-[12px] p-2 px-3 bg-[var(--theme-bg)] rounded-xl"
            >
              {{ item.toUpperCase() }}
            </p>
          }
        }
      </div>
      <div class="flex justify-between items-center">
        <div
          class="flex gap-2 items-center text-[var(--text-primary)] font-semibold tracking-wider"
        >
          <img [src]="job.photoUrl" class="w-[40px] h-[40px] rounded-[50%]" />
          <p class="font-medium">{{ job.fristName + ' ' + job.lastName }}</p>
        </div>
        <div class="flex gap-1 items-center">
          <p class="font-bold text-[var(--color-primary)] order-2">
            {{ job.budget }} <span class="font-extrabold">$</span>
          </p>
          <span
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-wallet opacity-70"
              aria-hidden="true"
            >
              <path
                d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"
              ></path>
              <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path>
            </svg>
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
