<div class="flex flex-col gap-4 p-3">
  @for (item of offers; track $index) {
    <div
      class="group bg-card-bg rounded-[40px] border border-[var(--border-components)] p-3 hover:shadow-2xl transition-all duration-500 relative flex flex-col gap-2 overflow-hidden text-left"
    >
      <div class="flex justify-end">
        <span
          class="px-6 py-2 rounded-full text-[11px] font-black border uppercase tracking-wider shadow-xs bg-green-500/10 text-green-500 border-amber-500/20"
          >Completed</span
        >
      </div>
      <div class="flex flex-col gap-3 w-full max-w-full">
        <h3
          class="text-2xl md:text-3xl font-black text-heading leading-tight group-hover:text-primary transition-colors wrap-break-word"
        >
          {{ item.jobTitle }}
        </h3>
        <p
          class="text-gray-medium text-base md:text-lg font-bold font-cairo leading-relaxed line-clamp-3 opacity-80wrap-break-word"
        >
          {{ item.description }}
        </p>
        <div class="flex flex-wrap items-center gap-3 mt-2 justify-end">
          <div
            class="flex items-center gap-2 px-3 py-1.5 bg-bg/50 border border-[var(--border-components)] rounded-xl shadow-xs transition-transform hover:scale-105 flex-row-reverse"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-banknote w-4 h-4 text-primary"
              aria-hidden="true"
            >
              <rect width="20" height="12" x="2" y="6" rx="2"></rect>
              <circle cx="12" cy="12" r="2"></circle>
              <path d="M6 12h.01M18 12h.01"></path>
            </svg>
            <div class="flex items-center gap-1">
              <span class="text-heading font-black text-sm">{{ item.price }}</span
              ><span
                class="text-gray-medium text-[9px] font-black uppercase opacity-60 tracking-tighter"
                >$</span
              >
            </div>
          </div>
          <div
            class="flex items-center gap-2 px-3 py-1.5 bg-bg/50 border border-[var(--border-components)] rounded-xl shadow-xs transition-transform hover:scale-105 flex-row-reverse"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-clock w-4 h-4 text-blue-500"
              aria-hidden="true"
            >
              <path d="M12 6v6l4 2"></path>
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            <div class="flex items-center gap-1">
              <span class="text-heading font-black text-sm">{{ item.duration | date }}</span>
            </div>
          </div>
          <div
            class="flex items-center gap-2 px-3 py-1.5 bg-bg/50 border border-[var(--border-components)] rounded-xl shadow-xs transition-transform hover:scale-105 flex-row-reverse"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-calendar w-4 h-4 text-gray-medium opacity-60"
              aria-hidden="true"
            >
              <path d="M8 2v4"></path>
              <path d="M16 2v4"></path>
              <rect width="18" height="18" x="3" y="4" rx="2"></rect>
              <path d="M3 10h18"></path>
            </svg>
            <span
              class="text-gray-medium text-[9px] font-black uppercase tracking-tighter opacity-80 whitespace-nowrap"
              >3 hours ago</span
            >
          </div>
        </div>
      </div>
      <div
        class="flex flex-col sm:flex-row items-center justify-between gap-6 pt-6 border-t border-[var(--border-components)] sm:flex-row-reverse"
      >
        <div
          class="flex flex-col xs:flex-row gap-3 items-center w-full sm:w-auto xs:flex-row-reverse"
        >
          <button
            class="w-full xs:w-auto flex items-center justify-center gap-2.5 border-[4px] border-[var(--border-components)] text-primary px-8 py-3.5 rounded-2xl font-black text-sm hover:bg-primary transition-all duration-300 active:scale-95 shadow-xl shadow-primary/10 cursor-pointer group/eye"
            [routerLink]="['../announcements', item.jobId]"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-eye w-4.5 h-4.5 group-hover/eye:scale-110 transition-transform"
              aria-hidden="true"
            >
              <path
                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
              ></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span class="whitespace-nowrap">View Details</span>
          </button>
        </div>
      </div>
    </div>
  }
</div>
